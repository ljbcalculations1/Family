<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Aldi Shopping List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Your exact Firebase keys
        const firebaseConfig = {
            apiKey: "AIzaSyBmPpIei1hKIvHogW179NQDUbQLkxvL18Q",
            authDomain: "family-shopping-4bf55.firebaseapp.com",
            databaseURL: "https://family-shopping-4bf55-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "family-shopping-4bf55",
            storageBucket: "family-shopping-4bf55.firebasestorage.app",
            messagingSenderId: "751044062742",
            appId: "1:751044062742:web:b39e5f52cd971166a6cf37",
            measurementId: "G-27HJWE70ST"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const itemsRef = ref(db, 'shoppingItems');

        // App state
        let currentMemberFilter = 'All';
        let items = [];
        let deletedItemTemp = null;
        let deleteTimeout = null;

        // Colors for family members
        const memberColors = {
            'Michelle': 'bg-pink-100 text-pink-700 border-pink-200',
            'Thomas': 'bg-blue-100 text-blue-700 border-blue-200',
            'George': 'bg-green-100 text-green-700 border-green-200',
            'Lee': 'bg-amber-100 text-amber-700 border-amber-200'
        };

        const memberBadgeColors = {
            'Michelle': 'bg-pink-500 text-white',
            'Thomas': 'bg-blue-500 text-white',
            'George': 'bg-green-500 text-white',
            'Lee': 'bg-amber-500 text-white'
        };

        // DOM Elements
        const itemInput = document.getElementById('itemInput');
        const memberSelect = document.getElementById('memberSelect');
        const categorySelect = document.getElementById('categorySelect');
        const addItemBtn = document.getElementById('addItemBtn');
        const itemsList = document.getElementById('itemsList');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const quickAddContainer = document.getElementById('quickAddChips');
        const datalist = document.getElementById('itemHistory');
        const connectionBadge = document.getElementById('connectionBadge');

        // Realtime Database Sync
        onValue(itemsRef, (snapshot) => {
            connectionBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-green-500 mr-1.5 animate-pulse"></span>Live Connected';
            connectionBadge.className = 'text-xs text-green-600 font-medium bg-green-50 px-2.5 py-1 rounded-full border border-green-200 flex items-center';
            
            const data = snapshot.val();
            items = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    items.push({ id: key, ...data[key] });
                });
                // Sort by creation time newest first
                items.sort((a, b) => b.createdAt - a.createdAt);
            }
            updateHistoryDatalist();
            renderItems();
        }, (error) => {
            console.error(error);
            connectionBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1.5"></span>Offline / Config Error';
            connectionBadge.className = 'text-xs text-red-600 font-medium bg-red-50 px-2.5 py-1 rounded-full border border-red-200 flex items-center';
        });

        // Add Item
        function addItem(nameOverride = null) {
            const name = nameOverride || itemInput.value.trim();
            if (!name) return;

            const selectedMember = memberSelect.value;
            const selectedCategory = categorySelect.value;
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + 
                            now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

            const newItem = {
                name: name,
                member: selectedMember,
                category: selectedCategory,
                timestamp: dateStr,
                createdAt: Date.now(),
                bought: false
            };

            push(itemsRef, newItem);

            if (!nameOverride) {
                itemInput.value = '';
                itemInput.focus();
            }
        }

        // Toggle Bought
        window.toggleBought = function(id, currentStatus) {
            const itemRef = ref(db, `shoppingItems/${id}`);
            update(itemRef, { bought: !currentStatus });
        };

        // Delete Item with Undo Toast
        window.deleteItem = function(id) {
            const itemToDelete = items.find(i => i.id === id);
            if (!itemToDelete) return;

            deletedItemTemp = { ...itemToDelete };
            remove(ref(db, `shoppingItems/${id}`));

            showUndoToast(deletedItemTemp);
        };

        function showUndoToast(item) {
            const toast = document.getElementById('undoToast');
            const toastText = document.getElementById('undoText');
            toastText.textContent = `Deleted "${item.name}"`;
            toast.classList.remove('hidden', 'translate-y-10', 'opacity-0');

            if (deleteTimeout) clearTimeout(deleteTimeout);
            deleteTimeout = setTimeout(() => {
                hideUndoToast();
            }, 5000);
        }

        window.hideUndoToast = function() {
            const toast = document.getElementById('undoToast');
            toast.classList.add('translate-y-10', 'opacity-0');
            setTimeout(() => toast.classList.add('hidden'), 300);
        };

        window.undoDelete = function() {
            if (deletedItemTemp) {
                const { id, ...itemData } = deletedItemTemp;
                push(itemsRef, itemData);
                deletedItemTemp = null;
                hideUndoToast();
            }
        };

        // Update typed history in datalist and chips
        function updateHistoryDatalist() {
            const uniqueNames = [...new Set(items.map(i => i.name.trim()))];
            datalist.innerHTML = uniqueNames.map(name => `<option value="${name}">`).join('');

            // Display top 5 recent unique items as quick chips
            const recentNames = uniqueNames.slice(0, 6);
            if (recentNames.length > 0) {
                quickAddContainer.innerHTML = recentNames.map(name => `
                    <button type="button" onclick="quickAdd('${name.replace(/'/g, "\\'")}')" class="px-2.5 py-1 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full border border-slate-300 transition-colors flex items-center space-x-1">
                        <i class="fa-solid font-bold text-slate-400">+</i>
                        <span>${name}</span>
                    </button>
                `).join('');
            } else {
                quickAddContainer.innerHTML = '';
            }
        }

        window.quickAdd = function(name) {
            addItem(name);
        };

        // Filter Member Event
        window.setMemberFilter = function(member) {
            currentMemberFilter = member;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                if (tab.dataset.member === member) {
                    tab.className = 'filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-blue-600 text-white active-tab';
                } else {
                    tab.className = 'filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-slate-100 text-slate-600 hover:bg-slate-200';
                }
            });
            renderItems();
        };

        // Share Summary via WhatsApp / Text
        window.shareSummary = function() {
            const unboughtItems = items.filter(i => !i.bought);
            if (unboughtItems.length === 0) {
                alert('Shopping list is currently empty!');
                return;
            }

            let text = "🛒 *Family Aldi Shopping List*\n\n";
            const grouped = {};
            unboughtItems.forEach(i => {
                if (!grouped[i.category]) grouped[i.category] = [];
                grouped[i.category].push(`${i.name} (${i.member})`);
            });

            for (const cat in grouped) {
                text += `*${cat.toUpperCase()}*\n`;
                grouped[cat].forEach(itemStr => {
                    text += `• ${itemStr}\n`;
                });
                text += `\n`;
            }

            if (navigator.share) {
                navigator.share({ title: 'Aldi Shopping List', text: text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text);
                alert('Shopping summary copied to clipboard!');
            }
        };

        // Render UI
        function renderItems() {
            const search = searchInput.value.toLowerCase().trim();
            const filtered = items.filter(item => {
                const matchesMember = (currentMemberFilter === 'All') || (item.member === currentMemberFilter);
                const matchesSearch = item.name.toLowerCase().includes(search) || item.member.toLowerCase().includes(search);
                return matchesMember && matchesSearch;
            });

            if (filtered.length === 0) {
                itemsList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Sort unbought top, bought bottom
            filtered.sort((a, b) => a.bought - b.bought);

            itemsList.innerHTML = filtered.map(item => `
                <div class="group bg-white rounded-2xl p-4 border ${item.bought ? 'border-slate-200 bg-slate-50/70 opacity-60' : 'border-slate-200/80 shadow-sm hover:shadow-md'} transition-all duration-200 flex items-center justify-between gap-3">
                    <div class="flex items-center space-x-3.5 flex-1 min-w-0">
                        <button onclick="toggleBought('${item.id}', ${item.bought})" class="w-7 h-7 rounded-full border-2 ${item.bought ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 hover:border-slate-400'} flex items-center justify-center transition-colors shrink-0">
                            ${item.bought ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>
                        
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center space-x-2">
                                <span class="text-base font-semibold text-slate-800 break-words ${item.bought ? 'line-through text-slate-400' : ''}">
                                    ${item.name}
                                </span>
                            </div>
                            <div class="flex items-center space-x-2 mt-1 flex-wrap gap-y-1">
                                <span class="px-2 py-0.5 rounded-md text-xs font-semibold ${memberBadgeColors[item.member] || 'bg-slate-500 text-white'} shadow-xs">
                                    ${item.member}
                                </span>
                                <span class="text-xs text-slate-400 flex items-center">
                                    <i class="fa-regular fa-clock mr-1 text-[10px]"></i> ${item.timestamp}
                                </span>
                                <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                                    ${item.category}
                                </span>
                            </div>
                        </div>
                    </div>

                    <button onclick="deleteItem('${item.id}')" class="text-slate-300 hover:text-red-500 p-2 rounded-xl hover:bg-red-50 transition-colors shrink-0">
                        <i class="fa-regular fa-trash-can text-lg"></i>
                    </button>
                </div>
            `).join('');
        }

        // Event Listeners
        addItemBtn.addEventListener('click', () => addItem());
        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addItem();
        });
        searchInput.addEventListener('input', renderItems);

        // Make functions global for inline button calls
        window.addItem = addItem;
    </script>
</head>
<body class="bg-slate-100 font-['Inter'] text-slate-800 min-h-screen pb-24">

    <!-- Sticky Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-xs">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-tight">Aldi Shopping</h1>
                    <div id="connectionBadge" class="text-xs text-slate-400 flex items-center">
                        <span class="inline-block w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span>Connecting...
                    </div>
                </div>
            </div>

            <button onclick="shareSummary()" class="p-2.5 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-900 transition-colors flex items-center space-x-1.5 text-xs font-semibold">
                <i class="fa-solid fa-share-nodes text-sm"></i>
                <span class="hidden sm:inline">Share List</span>
            </button>
        </div>

        <!-- Filter Tabs for Family Members -->
        <div class="max-w-xl mx-auto px-4 pb-3 flex space-x-2 overflow-x-auto no-scrollbar">
            <button onclick="setMemberFilter('All')" data-member="All" class="filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-blue-600 text-white">
                All Items
            </button>
            <button onclick="setMemberFilter('Michelle')" data-member="Michelle" class="filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-slate-100 text-slate-600 hover:bg-slate-200">
                Michelle
            </button>
            <button onclick="setMemberFilter('Thomas')" data-member="Thomas" class="filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-slate-100 text-slate-600 hover:bg-slate-200">
                Thomas
            </button>
            <button onclick="setMemberFilter('George')" data-member="George" class="filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-slate-100 text-slate-600 hover:bg-slate-200">
                George
            </button>
            <button onclick="setMemberFilter('Lee')" data-member="Lee" class="filter-tab px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm bg-slate-100 text-slate-600 hover:bg-slate-200">
                Lee
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

        <!-- Input Box Section -->
        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
            <div class="flex flex-col sm:flex-row gap-2">
                <div class="relative flex-1">
                    <input type="text" id="itemInput" list="itemHistory" placeholder="Add item (e.g. Milk, Eggs, Bread)..." 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-base font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all">
                    <datalist id="itemHistory"></datalist>
                </div>

                <div class="flex space-x-2">
                    <!-- Family Member Picker -->
                    <select id="memberSelect" class="bg-slate-50 border border-slate-300 text-slate-700 font-semibold text-sm rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shrink-0">
                        <option value="Michelle">Michelle</option>
                        <option value="Thomas">Thomas</option>
                        <option value="George">George</option>
                        <option value="Lee" selected>Lee</option>
                    </select>

                    <!-- Category / Aisle Picker -->
                    <select id="categorySelect" class="bg-slate-50 border border-slate-300 text-slate-700 font-semibold text-sm rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shrink-0">
                        <option value="Produce">🥦 Produce</option>
                        <option value="Chilled">🧀 Chilled/Dairy</option>
                        <option value="Bakery">🍞 Bakery</option>
                        <option value="Pantry">🥫 Pantry</option>
                        <option value="Frozen">❄️ Frozen</option>
                        <option value="Household">🧼 Household</option>
                    </select>
                </div>
            </div>

            <button idaddItemBtn" onclick="addItem()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md shadow-blue-500/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Add to Family List</span>
            </button>

            <!-- Autocomplete History Chips -->
            <div class="pt-1">
                <span class="text-xs text-slate-400 font-medium block mb-1.5">Quick Add Recent:</span>
                <div id="quickAddChips" class="flex flex-wrap gap-1.5"></div>
            </div>
        </section>

        <!-- Search Bar -->
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="Search items or family members..." 
                   class="w-full bg-white border border-slate-200/80 rounded-xl pl-10 pr-4 py-2.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-xs">
        </div>

        <!-- Dynamic Items List -->
        <section id="itemsList" class="space-y-2.5"></section>

        <!-- Empty State Container -->
        <div id="emptyState" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-dashed border-slate-300">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                <i class="fa-solid fa-basket-shopping text-2xl"></i>
            </div>
            <h3 class="font-bold text-slate-700 text-base">No items found</h3>
            <p class="text-slate-400 text-xs mt-1">Your Aldi shopping list is clear!</p>
        </div>

    </main>

    <!-- Undo Toast Notification -->
    <div id="undoToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center space-x-4 z-50 transition-all duration-300 hidden translate-y-10 opacity-0 min-w-[280px] justify-between">
        <span id="undoText" class="text-sm font-medium">Item deleted</span>
        <button onclick="undoDelete()" class="text-amber-400 hover:text-amber-300 font-bold text-sm uppercase tracking-wide px-2 py-1 rounded-lg hover:bg-slate-800 transition-colors">
            Undo
        </button>
    </div>

</body>
</html>
